<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enro CCTV Admin</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#17324d,#070b14 60%);color:#eef7ff;font:14px Inter,system-ui,sans-serif;min-height:100vh}.wrap{width:min(1000px,calc(100% - 32px));margin:45px auto}.panel{background:#ffffff0b;border:1px solid #8bdfff30;backdrop-filter:blur(18px);border-radius:18px;padding:24px;box-shadow:0 20px 60px #0006}h1{font-size:28px;margin:0 0 8px}h2{font-size:18px}.muted{color:#9db0c5}.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1}.field{display:flex;flex-direction:column;gap:7px;margin:12px 0}input,textarea,select{width:100%;padding:12px;border:1px solid #ffffff2b;border-radius:9px;background:#091626;color:#eff8ff}button,.button{border:0;border-radius:9px;padding:12px 16px;background:linear-gradient(110deg,#bdf6ff,#6edcf5,#9992ff);color:#06111d;font-weight:800;cursor:pointer}.secondary{background:#ffffff14;color:#dff5ff;border:1px solid #ffffff25}.danger{background:#542936;color:#ffdce5}.hidden{display:none!important}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:18px}.item{display:flex;gap:14px;align-items:center;padding:12px;border:1px solid #ffffff1b;border-radius:12px;margin:10px 0}.item img{width:90px;height:68px;object-fit:cover;border-radius:8px}.item .meta{flex:1}.item button{margin:3px}.status{margin:12px 0;color:#83eaff;min-height:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.thumb{width:100%;max-height:180px;object-fit:cover;border-radius:10px;margin-top:10px}@media(max-width:650px){.grid{grid-template-columns:1fr}.wrap{margin:20px auto}.panel{padding:17px}.item{align-items:flex-start}.item img{width:74px;height:62px}}
</style></head><body><main class="wrap">
<section id="login" class="panel" style="max-width:430px;margin:10vh auto"><div class="muted">ENRO CCTV · PRIVATE CONTROL PANEL</div><h1>Admin Login</h1><p class="muted">Masuk untuk mengelola foto dan video portofolio.</p><form id="loginForm"><label class="field">Password admin<input type="password" id="password" autocomplete="current-password" required></label><button type="submit">Login aman ↗</button></form><div class="status" id="loginStatus"></div></section>
<section id="dashboard" class="hidden"><div class="top"><div><div class="muted">ENRO CCTV / CONTENT MANAGEMENT</div><h1>Portfolio Manager</h1></div><button class="secondary" id="logout">Logout</button></div>
<div class="grid">
<section class="panel"><h2>Tambah foto proyek</h2><form id="photoForm">
<label class="field">Foto proyek<input id="photo" type="file" accept="image/jpeg,image/png,image/webp" required></label>
<label class="field">Nama proyek<input id="title" maxlength="90" required placeholder="Contoh: Instalasi CCTV Rumah"></label>
<div class="row"><label class="field">Kategori<select id="category"><option>Rumah</option><option>Kantor</option><option>Toko</option><option>Gudang</option><option>Lainnya</option></select></label><label class="field">Lokasi<input id="location" placeholder="Jakarta Selatan"></label></div>
<label class="field">Deskripsi<textarea id="description" rows="2" placeholder="Opsional"></textarea></label><button type="submit">Upload & Publish</button></form><div class="status" id="photoStatus"></div></section>
<section class="panel"><h2>Tambah video YouTube</h2><form id="videoForm"><label class="field">Judul video<input id="videoTitle" required></label><label class="field">Link YouTube<input id="youtubeUrl" type="url" required placeholder="https://youtu.be/..."></label><label class="field">Deskripsi<input id="videoDescription"></label><button type="submit">Simpan video</button></form><div class="status" id="videoStatus"></div><p class="muted">Video ditampilkan menggunakan YouTube embed.</p></section>
</div>
<section class="panel" style="margin-top:18px"><div class="top"><h2>Foto portofolio</h2><button class="secondary" id="refresh">Refresh</button></div><div id="photos"></div></section>
<section class="panel" style="margin-top:18px"><h2>Video portofolio</h2><div id="videos"></div></section>
</section></main><script>
const $=id=>document.getElementById(id);let data={projects:[],videos:[]};
async function api(url,opts={}){const r=await fetch(url,{...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request gagal');return j}
function showDash(){ $('login').classList.add('hidden');$('dashboard').classList.remove('hidden');load() }
async function load(){try{data=await api('/api/portfolio');render()}catch(e){$('photos').textContent=e.message}}
function render(){$('photos').innerHTML=data.projects.map(p=>`<div class="item"><img src="${p.image}"><div class="meta"><b>${esc(p.title)}</b><div class="muted">${esc(p.category)} · ${esc(p.location)}</div></div><button class="danger" onclick="delProject('${p.id}')">Hapus</button></div>`).join('')||'<p class="muted">Belum ada foto.</p>';$('videos').innerHTML=data.videos.map(v=>`<div class="item"><div class="meta"><b>${esc(v.title)}</b><div class="muted">${esc(v.youtubeId)}</div></div><button class="danger" onclick="delVideo('${v.id}')">Hapus</button></div>`).join('')||'<p class="muted">Belum ada video.</p>'}
function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginStatus').textContent='Memeriksa akses...';try{await api('/api/login',{method:'POST',body:JSON.stringify({password:$('password').value})});showDash()}catch(err){$('loginStatus').textContent=err.message}};
$('logout').onclick=async()=>{await api('/api/logout',{method:'POST'});location.reload()};
$('refresh').onclick=load;
$('photoForm').onsubmit=async e=>{e.preventDefault();const f=$('photo').files[0];if(!f)return;if(f.size>8*1024*1024){$('photoStatus').textContent='Maksimal ukuran foto 8 MB.';return}if(!['image/jpeg','image/png','image/webp'].includes(f.type)){$('photoStatus').textContent='Format harus JPG, PNG, atau WEBP.';return}const b64=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result.split(',')[1]);r.onerror=reject;r.readAsDataURL(f)});$('photoStatus').textContent='Mengupload foto ke GitHub...';try{await api('/api/upload',{method:'POST',body:JSON.stringify({filename:f.name,mime:f.type,data:b64,title:$('title').value,category:$('category').value,location:$('location').value,description:$('description').value})});$('photoStatus').textContent='Berhasil dipublikasikan.';$('photoForm').reset();load()}catch(err){$('photoStatus').textContent=err.message}};
$('videoForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/portfolio',{method:'PUT',body:JSON.stringify({action:'addVideo',title:$('videoTitle').value,url:$('youtubeUrl').value,description:$('videoDescription').value})});$('videoStatus').textContent='Video berhasil ditambahkan.';$('videoForm').reset();load()}catch(err){$('videoStatus').textContent=err.message}};
window.delProject=async id=>{if(!confirm('Hapus foto portofolio ini?'))return;try{await api('/api/portfolio',{method:'PUT',body:JSON.stringify({action:'deleteProject',id})});load()}catch(e){alert(e.message)}};
window.delVideo=async id=>{if(!confirm('Hapus video ini?'))return;try{await api('/api/portfolio',{method:'PUT',body:JSON.stringify({action:'deleteVideo',id})});load()}catch(e){alert(e.message)}};
api('/api/me').then(showDash).catch(()=>{});
</script></body></html>
